        - list [ref=e102]:
          - listitem [ref=e103]:
            - strong [ref=e104]: Проект
            - text: — обычная папка с
            - code [ref=e105]: osnova.json
            - text: ", материалами, артефактами и переносимыми сессиями."
          - listitem [ref=e106]:
            - strong [ref=e107]: Манифест
            - text: — файл
            - code [ref=e108]: osnova.json
            - text: ", который задаёт идентификатор, имя, тип, версию формата и требования к расширениям проекта."
          - listitem [ref=e109]:
            - strong [ref=e110]: Артефакт
            - text: — описанный результат операции с payload-файлом и происхождением.
          - listitem [ref=e111]:
            - strong [ref=e112]: Сессия
            - text: — журнал отдельной задачи или диалога внутри проекта.
          - listitem [ref=e113]:
            - strong [ref=e114]: Operation
            - text: — зарегистрированное вызываемое действие с входной и выходной схемами, разрешениями и оценкой риска.
          - listitem [ref=e115]:
            - strong [ref=e116]: Tool
            - text: — пользовательская возможность, которая выполняет одну или несколько операций через runtime API, CLI или запрос агента. Универсальная ручная поверхность в текущем desktop ещё не выведена в навигацию.
          - listitem [ref=e117]:
            - strong [ref=e118]: Extension
            - text: — пакет расширения с manifest, contributions, разрешениями и управляемой средой выполнения.
          - listitem [ref=e119]:
            - strong [ref=e120]: Envelope
            - text: — ограниченный пакет контекста с источниками, чувствительностью, получателями, бюджетом и признаком усечения.
          - listitem [ref=e121]:
            - strong [ref=e122]: Approval
            - text: — явное решение пользователя на действие, требующее разрешения.
          - listitem [ref=e123]:
            - strong [ref=e124]: Агент
            - text: — диалоговый tool-loop, который выбирает доступные операции, соблюдает policy и сохраняет события и результаты в сессии.
          - listitem [ref=e125]:
            - strong [ref=e126]: Queryn
            - text: — имя текущей desktop-оболочки и агентного интерфейса. Это не отдельный источник данных и не замена названию продукта Osnova.
