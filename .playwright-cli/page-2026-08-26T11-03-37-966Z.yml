        - heading [level=1] [ref=e41]:
          - text: Osnova
          - link "Permalink to \"Osnova\"" [ref=e42] [cursor=pointer]:
            - /url: "#osnova"
            - text: "#"
        - paragraph [ref=e43]: Osnova — local-first модульная среда для учебных и исследовательских проектов. Пользователь работает с обычной папкой, в которой хранятся заметки, материалы, сессии и результаты инструментов. Desktop-клиент помогает видеть эту структуру, а локальный runtime выполняет операции и опционально подключает агентный слой.
        - paragraph [ref=e44]: Windows и macOS являются равноправными desktop-целями. Папка проекта остаётся источником истины, а облачные модели, сеть и расширения являются подключаемыми возможностями.
        - heading [level=2] [ref=e45]:
          - text: Пять минут до общей картины
          - link "Permalink to \"Пять минут до общей картины\"" [ref=e46] [cursor=pointer]:
            - /url: "#пять-минут-до-общеи-картины"
            - text: "#"
